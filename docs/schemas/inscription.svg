<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 290" width="1280" height="290" role="img" aria-label="Un nouvel appareil rejoint le réseau en cinq étapes : 01 l'invitation, un QR à usage unique ; 02 l'appareil crée sa propre clé ; 03 l'admin compare l'empreinte, Qm7X-tR2k-9vLp ; 04 l'admin signe avec son doigt ; 05 l'appareil est dans le réseau, en 10.77.0.3, pour 120 jours.">
