  <text x="508" y="230" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#94A3B0" text-anchor="start" >muet sans mac1 valide</text>
</g><g>
  <rect x="450" y="280" width="380" height="76" rx="14" fill="#0C1117" stroke="#2A333D"/>
  
  <rect x="450" y="294" width="3" height="48" rx="1.5" fill="#01B9FD"/>
  <g transform="translate(468,304)"><rect x="3" y="5" width="22" height="18" rx="2" fill="none" stroke="#01B9FD" stroke-width="2"/><path d="M3 11 H25 M3 17 H25 M10 5 V11 M18 11 V17 M10 17 V23" stroke="#01B9FD" stroke-width="2"/></g>
  <text x="508" y="315" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" font-weight="700" fill="#F1F5F9" text-anchor="start" >TCP 443</text>
  <text x="508" y="335" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#94A3B0" text-anchor="start" >vpn. auth. maison., le reste coupé</text>
</g><g>
