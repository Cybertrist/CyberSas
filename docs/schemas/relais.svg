  <text x="1038" y="155" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" font-weight="700" fill="#F1F5F9" text-anchor="start" >maison</text>
  <text x="1038" y="175" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#94A3B0" text-anchor="start" >10.77.0.2 · à la maison</text>
</g>
<g filter="url(#halo)">
  <circle cx="300" cy="158" r="11" fill="#31E7FD" opacity="0.22"><animate attributeName="cx" dur="7s" repeatCount="indefinite" keyTimes="0;0.12;0.3;0.52;0.62;0.64;0.8;1" values="300.0;300.0;490.4;490.4;789.6;789.6;980.0;980.0"/></circle>
  <circle cx="300" cy="158" r="6" fill="#31E7FD"><animate attributeName="cx" dur="7s" repeatCount="indefinite" keyTimes="0;0.12;0.3;0.52;0.62;0.64;0.8;1" values="300.0;300.0;490.4;490.4;789.6;789.6;980.0;980.0"/></circle>
</g>
<g opacity="0"><animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.02;0.3;0.33;1" values="0;1;1;0;0"/>
  <rect x="20" y="224" width="300" height="112" rx="12" fill="#0A1017" stroke="#31E7FD" stroke-opacity="0.45"/>
  <text x="38" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#31E7FD" text-anchor="start" letter-spacing="2">EN CLAIR, SUR LE TÉLÉPHONE</text>
  <text x="38" y="278" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >GET / HTTP/1.1</text><text x="38" y="300" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >Host: maison.sas.internal</text>
</g>
<g opacity="0"><animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.29;0.32;0.6;0.63;1" values="0;0;1;1;0;0"/>
  <rect x="490" y="224" width="300" height="112" rx="12" fill="#0A1017" stroke="#FF5C63" stroke-opacity="0.45"/>
  <text x="508" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#FF5C63" text-anchor="start" letter-spacing="2">CE QUE VOIT LE SERVEUR</text>
  <text x="508" y="278" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >7f 3a 9c e1 0b 52 d4 88</text><text x="508" y="300" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >19 a7 f0 3e 6c 21 …</text>
</g>
<g opacity="0"><animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.59;0.62;0.95;0.98;1" values="0;0;1;1;0;0"/>
  <rect x="960" y="224" width="300" height="112" rx="12" fill="#0A1017" stroke="#3DDC97" stroke-opacity="0.45"/>
  <text x="978" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#3DDC97" text-anchor="start" letter-spacing="2">DÉCHIFFRÉ, À LA MAISON</text>
  <text x="978" y="278" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >GET / HTTP/1.1</text><text x="978" y="300" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" >Host: maison.sas.internal</text>
</g>
<text x="640" y="60" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#31E7FD" text-anchor="middle" letter-spacing="3">LE SERVEUR RELAIE CE QU’IL NE PEUT PAS LIRE</text>
<text x="640" y="88" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#94A3B0" text-anchor="middle" >Les deux appareils ont leur propre session Noise : le serveur n’en a pas les clés.</text>
</svg>