# CyberSas : la pile qui tourne sur le serveur public (le VPS).
#
# Un seul conteneur touche Internet en entrée : le relais. Il porte les
# ports 80 et 443, et Nginx vit dans son espace réseau. Headscale et
# oauth2-proxy ne sont joignables qu'à travers Nginx.
#
# Le relais est aussi un nœud du VPN : c'est par lui que Nginx atteint les
# services hébergés à la maison, sans qu'aucun port n'y soit ouvert.
#
# La connexion passe par Google : Headscale pour rejoindre le VPN,
# oauth2-proxy pour les services web. Les deux ont donc une sortie vers
# Internet, et seulement eux.
#
# Rien ne se lance à la main : scripts/sas.sh prépare les secrets et les
# configurations dans etat/, puis démarre la pile.

name: cybersas

x-journaux: &journaux
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  relais:
    image: tailscale/tailscale:v1.102.4
    hostname: relais
    restart: unless-stopped
    <<: *journaux
    # tailscaled seul : l'inscription se fait ensuite par sas.sh, avec une
    # clé à usage unique, pour qu'aucune clé ne dorme dans ce fichier.
    command: ["tailscaled", "--state=/var/lib/tailscale/tailscaled.state", "--tun=tailscale0"]
    cap_add: [NET_ADMIN, NET_RAW]
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment:
      # Les racines du système, plus l'autorité du labo quand il y en a une.
      SSL_CERT_DIR: /etc/ssl/certs:/ca
    volumes:
      - relais:/var/lib/tailscale
      - ./etat/ca/public:/ca:ro
    ports:
      - "${PORT_HTTP:-80}:80"
      - "${PORT_HTTPS:-443}:443"
    networks:
      public:
        aliases: &noms ["hs.${DOMAINE}", "auth.${DOMAINE}", "maison.${DOMAINE}"]
      interne:
        aliases: *noms

  nginx:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    <<: *journaux
    network_mode: service:relais
    depends_on: [relais]
    environment:
      DOMAINE: ${DOMAINE}
      # Seule DOMAINE est remplacée dans les modèles : $host et les autres
      # variables de Nginx restent intactes.
      NGINX_ENVSUBST_FILTER: "^DOMAINE$$"
    volumes:
      - ./nginx/modeles:/etc/nginx/templates:ro
      - ./nginx/extraits:/etc/nginx/extraits:ro
      - ./etat/tls:/etc/nginx/tls:ro
      - journaux-nginx:/var/log/nginx

  headscale:
    image: headscale/headscale:0.29.4
    restart: unless-stopped
    <<: *journaux
    command: serve
    read_only: true
    tmpfs: [/var/run/headscale]
    environment:
      SSL_CERT_DIR: /etc/ssl/certs:/ca
    volumes:
      - ./etat/headscale:/etc/headscale:ro
      - ./etat/secrets/google:/secrets:ro
      - ./etat/ca/public:/ca:ro
      - headscale:/var/lib/headscale
    networks: [interne, sortie]
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 10s
      retries: 12

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
    restart: unless-stopped
    <<: *journaux
    command: ["--config=/config/oauth2-proxy.cfg"]
    read_only: true
    volumes:
      - ./etat/oauth2-proxy:/config:ro
      - ./etat/secrets/google:/secrets:ro
    networks: [interne, sortie]

networks:
  public:
    name: cybersas_public
    ipam:
      config: [{subnet: 172.30.1.0/24}]
  interne:
    name: cybersas_interne
    # Pas de passerelle : ce qui n'est que sur ce réseau ne sort jamais.
    internal: true
    ipam:
      config: [{subnet: 172.30.2.0/24}]
  # La sortie vers Google, pour Headscale et oauth2-proxy seulement.
  sortie:
    name: cybersas_sortie
    ipam:
      config: [{subnet: 172.30.3.0/24}]

volumes:
  relais:
  headscale:
  journaux-nginx:
