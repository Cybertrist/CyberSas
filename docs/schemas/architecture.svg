<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 570" width="1280" height="570" role="img" aria-label="L'architecture. Au milieu, le VPS, seul point public : sasd (tunnel, relais, API, pare-feu, DNS), Nginx sur le port 443 pour vpn., auth. et maison., et oauth2-proxy pour la connexion Google des pages. À gauche, le téléphone fold8-tristan avec l'appli Android et laptop-lea avec le client sas ouvrent leur tunnel vers sasd en UDP 51820. À droite, la maison sort elle aussi vers le VPS : aucun port ouvert chez elle. Un paquet du téléphone vers la maison est relayé par sasd, chiffré de bout en bout. oauth2-proxy parle à Google.">
<title>L'architecture. Au milieu, le VPS, seul point public : sasd (tunnel, relais, API, pare-feu, DNS), Nginx sur le port 443 pour vpn., auth. et maison., et oauth2-proxy pour la connexion Google des pages. À gauche, le téléphone fold8-tristan avec l'appli Android et laptop-lea avec le client sas ouvrent leur tunnel vers sasd en UDP 51820. À droite, la maison sort elle aussi vers le VPS : aucun port ouvert chez elle. Un paquet du téléphone vers la maison est relayé par sasd, chiffré de bout en bout. oauth2-proxy parle à Google.</title>
<defs>
  <filter id="halo" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="doux" x="-50%" y="-50%" width="200%" height="200%">
