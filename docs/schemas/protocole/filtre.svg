<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 530" width="1280" height="530" role="img" aria-label="Le filtre, chez l'appareil qui reçoit. Un paquet entrant, déjà déchiffré, passe deux questions : une règle l'autorise-t-elle pour ce pair, ce protocole et ce port ? Sinon, répond-il à un flux que l'appareil a lui-même ouvert vers ce pair ? Oui à l'une : il entre. Non aux deux : il est jeté en silence. Trois exemples : TCP 443 autorisé par une règle entre ; TCP 22 sans règle est jeté ; UDP 53, réponse à une question de l'appareil, entre. Les flux sont suivis cinq minutes en TCP, une en UDP, trente secondes pour un écho, avec un budget par pair.">
<title>Le filtre, chez l'appareil qui reçoit. Un paquet entrant, déjà déchiffré, passe deux questions : une règle l'autorise-t-elle pour ce pair, ce protocole et ce port ? Sinon, répond-il à un flux que l'appareil a lui-même ouvert vers ce pair ? Oui à l'une : il entre. Non aux deux : il est jeté en silence. Trois exemples : TCP 443 autorisé par une règle entre ; TCP 22 sans règle est jeté ; UDP 53, réponse à une question de l'appareil, entre. Les flux sont suivis cinq minutes en TCP, une en UDP, trente secondes pour un écho, avec un budget par pair.</title>
