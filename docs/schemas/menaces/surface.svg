<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 676" width="1280" height="676" role="img" aria-label="La surface d'attaque. Quelqu'un sur Internet scanne. Sur le VPS, seul point public : le port UDP 51820 du tunnel reste muet sans mac1 valide ; le port TCP 443 ne sert que vpn., auth. et maison., tout autre nom est coupé avant l'échange de certificat ; le port TCP 80 ne fait que rediriger vers 443. À la maison, aucun port ouvert : rien n'écoute. L'API de sasd n'écoute que sur 127.0.0.1, derrière Nginx.">
<title>La surface d'attaque. Quelqu'un sur Internet scanne. Sur le VPS, seul point public : le port UDP 51820 du tunnel reste muet sans mac1 valide ; le port TCP 443 ne sert que vpn., auth. et maison., tout autre nom est coupé avant l'échange de certificat ; le port TCP 80 ne fait que rediriger vers 443. À la maison, aucun port ouvert : rien n'écoute. L'API de sasd n'écoute que sur 127.0.0.1, derrière Nginx.</title>
<defs>
  <filter id="halo" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="doux" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="flou" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  <pattern id="grille" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#31E7FD" stroke-opacity="0.05"/>
  </pattern>
  <radialGradient id="lueur" cx="50%" cy="0%" r="80%">
    <stop offset="0" stop-color="#31E7FD" stop-opacity="0.10"/><stop offset="1" stop-color="#31E7FD" stop-opacity="0"/>
  </radialGradient>
  <marker id="pCYAN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 Z" fill="#31E7FD"/></marker>
  <marker id="pBLEU" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 Z" fill="#01B9FD"/></marker>
  <marker id="pVERT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 Z" fill="#3DDC97"/></marker>
  <marker id="pROUGE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 Z" fill="#FF5C63"/></marker>
  <marker id="pFIL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 Z" fill="#2F3A47"/></marker>
  <marker id="pDISCRET" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 Z" fill="#5C6A7A"/></marker>
</defs>
<rect width="1280" height="676" rx="16" fill="#0D1117"/>
<rect width="1280" height="676" rx="16" fill="url(#grille)"/>
<rect width="1280" height="676" rx="16" fill="url(#lueur)"/>

<text x="640" y="56" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#31E7FD" text-anchor="middle" letter-spacing="3" >CE QUI EST EXPOSÉ, ET CE QUI RÉPOND</text><text x="640" y="84" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#94A3B0" text-anchor="middle" >Un seul point public, le VPS. Un scan n’y trouve presque rien à qui parler.</text>
<rect x="420" y="140" width="440" height="400" rx="18" fill="#01B9FD" fill-opacity="0.03" stroke="#01B9FD" stroke-opacity="0.55" stroke-dasharray="3 6"/>
<text x="438" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#01B9FD" text-anchor="start" letter-spacing="2.5" >LE VPS</text><rect x="960" y="200" width="280" height="220" rx="18" fill="#3DDC97" fill-opacity="0.03" stroke="#3DDC97" stroke-opacity="0.55" stroke-dasharray="3 6"/>
<text x="978" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#3DDC97" text-anchor="start" letter-spacing="2.5" >LA MAISON</text>
<g opacity="0.6"><path d="M 300 304 C 375 304 375 213 450 213" fill="none" stroke="#FF5C63" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 7" marker-end="url(#pROUGE)"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/></path><circle cx="300" cy="304" r="3.5" fill="#0D1117" stroke="#FF5C63" stroke-width="2"/></g><g opacity="0.6"><path d="M 300 320 L 450 318" fill="none" stroke="#FF5C63" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 7" marker-end="url(#pROUGE)"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/></path><circle cx="300" cy="320" r="3.5" fill="#0D1117" stroke="#FF5C63" stroke-width="2"/></g><g opacity="0.6"><path d="M 300 336 C 375 336 375 423 450 423" fill="none" stroke="#FF5C63" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 7" marker-end="url(#pROUGE)"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/></path><circle cx="300" cy="336" r="3.5" fill="#0D1117" stroke="#FF5C63" stroke-width="2"/></g>
<g opacity="0.6"><path d="M 170 360 V 600 H 1100 V 350" fill="none" stroke="#FF5C63" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 7"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/></path><circle cx="170" cy="360" r="3.5" fill="#0D1117" stroke="#FF5C63" stroke-width="2"/></g>
<g>
