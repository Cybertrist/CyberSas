  <text x="508" y="420" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" font-weight="700" fill="#F1F5F9" text-anchor="start" >TCP 80</text>
  <text x="508" y="440" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#94A3B0" text-anchor="start" >redirige vers 443, rien d’autre</text>
