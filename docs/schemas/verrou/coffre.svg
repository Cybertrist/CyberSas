<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 394" width="1280" height="394" role="img" aria-label="Le coffre de la clé du verrou sur le téléphone de l'admin, en cinq temps : l'empreinte, par l'invite biométrique forte d'Android ; la clé AES du Keystore, dans la puce StrongBox, utilisable pour cette seule opération ; le fichier verrou.chiffre, déchiffré en mémoire ; le moteur Go, qui signe le document ; puis la clé est effacée, ses tableaux remis à zéro. Une empreinte ajoutée au téléphone invalide la clé AES. Le fichier chiffré copié ailleurs ne vaut rien.">
<title>Le coffre de la clé du verrou sur le téléphone de l'admin, en cinq temps : l'empreinte, par l'invite biométrique forte d'Android ; la clé AES du Keystore, dans la puce StrongBox, utilisable pour cette seule opération ; le fichier verrou.chiffre, déchiffré en mémoire ; le moteur Go, qui signe le document ; puis la clé est effacée, ses tableaux remis à zéro. Une empreinte ajoutée au téléphone invalide la clé AES. Le fichier chiffré copié ailleurs ne vaut rien.</title>
<defs>
  <filter id="halo" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="doux" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="flou" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  <pattern id="grille" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#31E7FD" stroke-opacity="0.05"/>
  </pattern>
  <radialGradient id="lueur" cx="50%" cy="0%" r="80%">
    <stop offset="0" stop-color="#31E7FD" stop-opacity="0.10"/><stop offset="1" stop-color="#31E7FD" stop-opacity="0"/>
  </radialGradient>
  <marker id="pCYAN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 Z" fill="#31E7FD"/></marker>
  <marker id="pBLEU" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 Z" fill="#01B9FD"/></marker>
  <marker id="pVERT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 Z" fill="#3DDC97"/></marker>
  <marker id="pROUGE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 Z" fill="#FF5C63"/></marker>
  <marker id="pFIL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 Z" fill="#2F3A47"/></marker>
  <marker id="pDISCRET" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 Z" fill="#5C6A7A"/></marker>
</defs>
<rect width="1280" height="394" rx="16" fill="#0D1117"/>
<rect width="1280" height="394" rx="16" fill="url(#grille)"/>
<rect width="1280" height="394" rx="16" fill="url(#lueur)"/>

<text x="640" y="56" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#31E7FD" text-anchor="middle" letter-spacing="3" >LE COFFRE DE LA CLÉ DU VERROU, SUR LE TÉLÉPHONE</text><text x="640" y="84" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#94A3B0" text-anchor="middle" >Une empreinte ouvre le coffre pour une seule opération. La clé déchiffrée ne vit que le temps de signer.</text>
<g opacity="1"><path d="M 256 210 L 289 210" fill="none" stroke="#01B9FD" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 7" marker-end="url(#pBLEU)"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/></path></g><g opacity="1"><path d="M 501 210 L 534 210" fill="none" stroke="#01B9FD" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 7" marker-end="url(#pBLEU)"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/></path></g><g opacity="1"><path d="M 746 210 L 779 210" fill="none" stroke="#01B9FD" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 7" marker-end="url(#pBLEU)"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/></path></g><g opacity="1"><path d="M 991 210 L 1024 210" fill="none" stroke="#01B9FD" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 7" marker-end="url(#pBLEU)"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/></path></g>
