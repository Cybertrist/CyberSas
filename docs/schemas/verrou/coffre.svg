  <text x="102" y="207" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="700" fill="#F1F5F9" text-anchor="start" >empreinte</text>
  <text x="102" y="227" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#94A3B0" text-anchor="start" >invite biométrique</text>
</g><g>
  <rect x="289" y="170" width="212" height="80" rx="14" fill="#0C1117" stroke="#2A333D"/>
  <rect x="289" y="170" width="212" height="80" rx="14" fill="none" stroke="#01B9FD" stroke-width="1.6" opacity="0" filter="url(#halo)"><animate attributeName="opacity" dur="11s" repeatCount="indefinite" keyTimes="0;0.18;0.2;0.36;0.38;1" values="0;0;1;1;0;0"/></rect>
  <rect x="289" y="184" width="3" height="52" rx="1.5" fill="#01B9FD"/>
  <g transform="translate(307,196)"><rect x="7" y="7" width="14" height="14" rx="2.5" fill="none" stroke="#01B9FD" stroke-width="2"/><rect x="11" y="11" width="6" height="6" rx="1" fill="#01B9FD"/><path d="M11 3 V7 M17 3 V7 M11 21 V25 M17 21 V25 M3 11 H7 M3 17 H7 M21 11 H25 M21 17 H25" stroke="#01B9FD" stroke-width="2" stroke-linecap="round"/></g>
  <text x="347" y="207" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="700" fill="#F1F5F9" text-anchor="start" >clé AES</text>
  <text x="347" y="227" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#94A3B0" text-anchor="start" >StrongBox, une fois</text>
</g><g>
  <rect x="534" y="170" width="212" height="80" rx="14" fill="#0C1117" stroke="#2A333D"/>
  <rect x="534" y="170" width="212" height="80" rx="14" fill="none" stroke="#01B9FD" stroke-width="1.6" opacity="0" filter="url(#halo)"><animate attributeName="opacity" dur="11s" repeatCount="indefinite" keyTimes="0;0.34;0.36;0.52;0.54;1" values="0;0;1;1;0;0"/></rect>
  <rect x="534" y="184" width="3" height="52" rx="1.5" fill="#01B9FD"/>
  <g transform="translate(552,196)"><rect x="5" y="12" width="18" height="14" rx="3" fill="none" stroke="#01B9FD" stroke-width="2"/><path d="M9 12 V8 A5 5 0 0 1 19 8 V12" fill="none" stroke="#01B9FD" stroke-width="2"/><path d="M14 17 V21" stroke="#01B9FD" stroke-width="2" stroke-linecap="round"/></g>
  <text x="592" y="207" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="700" fill="#F1F5F9" text-anchor="start" >verrou.chiffre</text>
  <text x="592" y="227" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#94A3B0" text-anchor="start" >déchiffré en mémoire</text>
</g><g>
  <rect x="779" y="170" width="212" height="80" rx="14" fill="#0C1117" stroke="#2A333D"/>
  <rect x="779" y="170" width="212" height="80" rx="14" fill="none" stroke="#31E7FD" stroke-width="1.6" opacity="0" filter="url(#halo)"><animate attributeName="opacity" dur="11s" repeatCount="indefinite" keyTimes="0;0.5;0.52;0.68;0.7;1" values="0;0;1;1;0;0"/></rect>
  <rect x="779" y="184" width="3" height="52" rx="1.5" fill="#31E7FD"/>
  <g transform="translate(797,196)"><circle cx="14" cy="12" r="8" fill="none" stroke="#31E7FD" stroke-width="2"/><path d="M10 12 L13 15 L18.5 9.5 M9 18.5 L7 26 L11 24 L14 27 M19 18.5 L21 26 L17 24 L14 27" fill="none" stroke="#31E7FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="837" y="207" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="700" fill="#F1F5F9" text-anchor="start" >moteur Go</text>
  <text x="837" y="227" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#94A3B0" text-anchor="start" >signe le document</text>
