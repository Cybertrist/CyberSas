  <text x="98" y="155" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" font-weight="700" fill="#F1F5F9" text-anchor="start" >fold8-tristan</text>
  <text x="98" y="175" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#94A3B0" text-anchor="start" >10.77.0.18 · le téléphone</text>
</g>
<g>
  <rect x="490" y="120" width="300" height="76" rx="14" fill="#0C1117" stroke="#2A333D"/>
  <rect x="490" y="120" width="300" height="76" rx="14" fill="none" stroke="#01B9FD" stroke-width="1.6" opacity="0" filter="url(#halo)"><animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.3;0.32;0.6;0.62;1" values="0;0;1;1;0;0"/></rect>
