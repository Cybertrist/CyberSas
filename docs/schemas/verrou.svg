<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-label="Un serveur piraté glisse un intrus dans le réseau : le téléphone fold8-tristan vérifie le certificat, ne trouve pas de signature du verrou, et le refuse. L'ordinateur laptop-lea, signé par le verrou, est accepté.">
<title>Un serveur piraté glisse un intrus dans le réseau : le téléphone fold8-tristan vérifie le certificat, ne trouve pas de signature du verrou, et le refuse. L'ordinateur laptop-lea, signé par le verrou, est accepté.</title>
<defs>
  <filter id="halo" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="flou" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  <pattern id="grille" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#31E7FD" stroke-opacity="0.05"/>
  </pattern>
  <radialGradient id="lueur" cx="50%" cy="0%" r="80%">
    <stop offset="0" stop-color="#31E7FD" stop-opacity="0.10"/><stop offset="1" stop-color="#31E7FD" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1280" height="330" rx="16" fill="#0D1117"/>
<rect width="1280" height="330" rx="16" fill="url(#grille)"/>
<rect width="1280" height="330" rx="16" fill="url(#lueur)"/>

<text x="640" y="60" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#31E7FD" text-anchor="middle" letter-spacing="3">UN SERVEUR PIRATÉ NE FAIT ENTRER PERSONNE</text>
<text x="640" y="88" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#94A3B0" text-anchor="middle" >Chaque appareil vérifie lui-même le certificat de l’autre, signé par la clé du verrou.</text>
<path d="M 330 158 H 930" fill="none" stroke="#2F3A47" stroke-width="2" stroke-dasharray="6 7">
  <animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/></path><path d="M 330 268 H 930" fill="none" stroke="#2F3A47" stroke-width="2" stroke-dasharray="6 7">
  <animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/></path>
<g>
  <rect x="60" y="120" width="270" height="76" rx="14" fill="#0C1117" stroke="#2A333D"/>
  <rect x="60" y="120" width="270" height="76" rx="14" fill="none" stroke="#FF5C63" stroke-width="1.6" opacity="0" filter="url(#halo)"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.03;0.05;0.45;0.47;1" values="0;0;1;1;0;0"/></rect>
  <rect x="60" y="134" width="3" height="48" rx="1.5" fill="#FF5C63"/>
  <g transform="translate(78,144)"><path d="M6 16 A8 8 0 1 1 22 16 V20 H18 V24 H10 V20 H6 Z" fill="none" stroke="#FF5C63" stroke-width="2" stroke-linejoin="round"/><circle cx="10.5" cy="14" r="2" fill="#FF5C63"/><circle cx="17.5" cy="14" r="2" fill="#FF5C63"/></g>
  <text x="118" y="155" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" font-weight="700" fill="#F1F5F9" text-anchor="start" >intrus</text>
  <text x="118" y="175" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#94A3B0" text-anchor="start" >glissé par le serveur</text>
</g>
<g>
  <rect x="60" y="230" width="270" height="76" rx="14" fill="#0C1117" stroke="#2A333D"/>
  <rect x="60" y="230" width="270" height="76" rx="14" fill="none" stroke="#3DDC97" stroke-width="1.6" opacity="0" filter="url(#halo)"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.48;0.5;0.92;0.94;1" values="0;0;1;1;0;0"/></rect>
  <rect x="60" y="244" width="3" height="48" rx="1.5" fill="#3DDC97"/>
  <g transform="translate(78,254)"><rect x="5" y="5" width="18" height="13" rx="2" fill="none" stroke="#3DDC97" stroke-width="2"/><path d="M2 23 H26" stroke="#3DDC97" stroke-width="2" stroke-linecap="round"/></g>
  <text x="118" y="265" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" font-weight="700" fill="#F1F5F9" text-anchor="start" >laptop-lea</text>
  <text x="118" y="285" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#94A3B0" text-anchor="start" >signée par le verrou</text>
</g>
<g>
  <rect x="930" y="175" width="290" height="76" rx="14" fill="#0C1117" stroke="#2A333D"/>
  <rect x="930" y="175" width="290" height="76" rx="14" fill="none" stroke="#31E7FD" stroke-width="1.6" opacity="0" filter="url(#halo)"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.03;0.05;0.92;0.94;1" values="0;0;1;1;0;0"/></rect>
  <rect x="930" y="189" width="3" height="48" rx="1.5" fill="#31E7FD"/>
  <g transform="translate(948,199)"><path d="M14 2 L24 6 V13 C24 19 19.5 23.5 14 26 C8.5 23.5 4 19 4 13 V6 Z" fill="none" stroke="#31E7FD" stroke-width="2" stroke-linejoin="round"/><path d="M9.5 14 L12.5 17 L18.5 11" fill="none" stroke="#31E7FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="988" y="210" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" font-weight="700" fill="#F1F5F9" text-anchor="start" >fold8-tristan</text>
  <text x="988" y="230" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#94A3B0" text-anchor="start" >vérifie la signature</text>
</g>
<g filter="url(#halo)">
  <circle cx="330" cy="158" r="10" fill="#FF5C63" opacity="0.22"><animate attributeName="cx" dur="9s" repeatCount="indefinite" keyTimes="0;0.06;0.3;0.46;1" values="330.0;330.0;900.0;900.0;900.0"/></circle>
  <circle cx="330" cy="158" r="5" fill="#FF5C63"><animate attributeName="cx" dur="9s" repeatCount="indefinite" keyTimes="0;0.06;0.3;0.46;1" values="330.0;330.0;900.0;900.0;900.0"/></circle>
</g>
<g filter="url(#halo)">
  <circle cx="330" cy="268" r="10" fill="#3DDC97" opacity="0.22"><animate attributeName="cx" dur="9s" repeatCount="indefinite" keyTimes="0;0.5;0.52;0.75;1" values="330.0;330.0;330.0;900.0;900.0"/></circle>
  <circle cx="330" cy="268" r="5" fill="#3DDC97"><animate attributeName="cx" dur="9s" repeatCount="indefinite" keyTimes="0;0.5;0.52;0.75;1" values="330.0;330.0;330.0;900.0;900.0"/></circle>
</g>
<g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.28;0.3;0.46;0.48;1" values="0;0;1;1;0;0"/>
  <rect x="520" y="138" width="240" height="40" rx="10" fill="#1A0D10" stroke="#FF5C63" stroke-opacity="0.6"/>
  <text x="640" y="163" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#FF5C63" text-anchor="middle" >refusé · pas de signature</text></g>
<g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.73;0.75;0.92;0.94;1" values="0;0;1;1;0;0"/>
  <rect x="520" y="248" width="240" height="40" rx="10" fill="#0B1A14" stroke="#3DDC97" stroke-opacity="0.6"/>
  <text x="640" y="273" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#3DDC97" text-anchor="middle" >accepté · signé par le verrou</text></g>
</svg>