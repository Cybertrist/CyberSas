# CyberSas : la pile qui tourne sur le serveur public (le VPS).
#
# sasd est tout le VPN : le moteur du tunnel, l'API où les appareils
# s'inscrivent, le pare-feu entre appareils et le DNS du réseau.
#
# porte ne fait rien : elle possède l'espace réseau, les ports et les noms,
# et ne redémarre jamais. sasd et Nginx s'y greffent. Si l'un d'eux
# redémarre, l'autre garde son réseau : c'est le conteneur « pause » des
# pods Kubernetes.
#
# Comme Nginx partage l'interface du VPN que sasd crée, il atteint les
# services de la maison par le tunnel, sans qu'aucun port ne soit ouvert
# là-bas.
#
# oauth2-proxy protège les pages web publiées avec la connexion Google.
#
# Rien ne se lance à la main : scripts/sas.sh prépare les secrets et les
# configurations dans etat/, puis démarre la pile.

name: cybersas

x-journaux: &journaux
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  porte:
    image: alpine:3.24
    restart: unless-stopped
    command: ["sleep", "infinity"]
    init: true
    sysctls:
      # Les paquets d'un appareil à l'autre traversent le serveur.
      net.ipv4.ip_forward: "1"
    ports:
      - "${PORT_HTTP:-80}:80"
      - "${PORT_HTTPS:-443}:443"
      - "${PORT_TUNNEL:-51820}:51820/udp"
    networks:
      public:
        aliases: &noms ["vpn.${DOMAINE}", "auth.${DOMAINE}", "maison.${DOMAINE}"]
      interne:
        aliases: *noms

  sasd:
    build: .
    image: cybersas:dev
    restart: unless-stopped
    <<: *journaux
    command: ["sasd"]
    network_mode: service:porte
    depends_on: [porte]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment:
      SAS_DOMAINE: ${DOMAINE}
      SAS_POINT: vpn.${DOMAINE}:${PORT_TUNNEL:-51820}
    volumes:
      - sasd:/var/lib/sasd
      - ./etat/sasd/equipe.txt:/config/equipe.txt:ro
      - ./etat/sasd/clients_google:/config/clients_google:ro
      - ./etat/sasd/verrou.pub:/config/verrou.pub:ro
      - ./politique/politique.json:/config/politique.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/sante"]
      interval: 5s
      retries: 12

  nginx:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    <<: *journaux
    network_mode: service:porte
    depends_on: [porte]
    environment:
      DOMAINE: ${DOMAINE}
      # Seule DOMAINE est remplacée dans les modèles : $host et les autres
      # variables de Nginx restent intactes.
      NGINX_ENVSUBST_FILTER: "^DOMAINE$$"
    volumes:
      - ./nginx/modeles:/etc/nginx/templates:ro
      - ./nginx/extraits:/etc/nginx/extraits:ro
      - ./etat/tls:/etc/nginx/tls:ro
      - journaux-nginx:/var/log/nginx

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
    restart: unless-stopped
    <<: *journaux
    command: ["--config=/config/oauth2-proxy.cfg"]
    read_only: true
    volumes:
      - ./etat/oauth2-proxy:/config:ro
      - ./etat/secrets/google:/secrets:ro
    networks: [interne, sortie]

networks:
  public:
    name: cybersas_public
    ipam:
      config: [{subnet: 172.30.1.0/24}]
  interne:
    name: cybersas_interne
    # Pas de passerelle : ce qui n'est que sur ce réseau ne sort jamais.
    internal: true
    ipam:
      config: [{subnet: 172.30.2.0/24}]
  # La sortie vers Google, pour oauth2-proxy.
  sortie:
    name: cybersas_sortie
    ipam:
      config: [{subnet: 172.30.3.0/24}]

volumes:
  sasd:
  journaux-nginx:
