<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 370" width="1280" height="370" role="img" aria-label="Un paquet part du téléphone fold8-tristan, en clair : GET / HTTP/1.1. Il traverse le serveur sasd, qui ne voit que des octets chiffrés, puis arrive déchiffré à la maison. Le serveur relaie ce qu'il ne peut pas lire.">
<title>Un paquet part du téléphone fold8-tristan, en clair : GET / HTTP/1.1. Il traverse le serveur sasd, qui ne voit que des octets chiffrés, puis arrive déchiffré à la maison. Le serveur relaie ce qu'il ne peut pas lire.</title>
<defs>
  <filter id="halo" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="flou" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  <pattern id="grille" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#31E7FD" stroke-opacity="0.05"/>
  </pattern>
  <radialGradient id="lueur" cx="50%" cy="0%" r="80%">
    <stop offset="0" stop-color="#31E7FD" stop-opacity="0.10"/><stop offset="1" stop-color="#31E7FD" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1280" height="370" rx="16" fill="#0D1117"/>
<rect width="1280" height="370" rx="16" fill="url(#grille)"/>
<rect width="1280" height="370" rx="16" fill="url(#lueur)"/>

<path d="M 300 158 H 490" fill="none" stroke="#2F3A47" stroke-width="2" stroke-dasharray="6 7">
