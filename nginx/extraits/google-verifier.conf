# Avant de servir la requête, demander à oauth2-proxy. Connecté : on passe,
# avec l'adresse Google de la personne dans X-Email. Sinon : direction la
# connexion (@connexion, définie dans chaque serveur protégé).
auth_request /oauth2/auth;
error_page 401 = @connexion;

auth_request_set $sas_utilisateur $upstream_http_x_auth_request_email;
proxy_set_header X-Email $sas_utilisateur;
proxy_set_header X-User $sas_utilisateur;
