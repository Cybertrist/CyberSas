  <g transform="translate(58,306)"><path d="M6 16 A8 8 0 1 1 22 16 V20 H18 V24 H10 V20 H6 Z" fill="none" stroke="#FF5C63" stroke-width="2" stroke-linejoin="round"/><circle cx="10.5" cy="14" r="2" fill="#FF5C63"/><circle cx="17.5" cy="14" r="2" fill="#FF5C63"/></g>
  <text x="98" y="317" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" font-weight="700" fill="#F1F5F9" text-anchor="start" >n’importe qui</text>
  <text x="98" y="337" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#94A3B0" text-anchor="start" >sur Internet, qui scanne</text>
</g><g>
