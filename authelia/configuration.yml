# Authelia : l'identité de l'équipe.
#
# Deux rôles. Pour le VPN, c'est le fournisseur OpenID Connect de Headscale :
# rejoindre le réseau demande un mot de passe et un second facteur. Pour les
# services web publiés, Nginx lui demande avant chaque requête si la
# personne a le droit de passer.
#
# Les secrets ne sont pas ici : ils arrivent par les variables *_FILE du
# compose, ou par fileContent ci-dessous. {{ env "DOMAINE" }} est remplacé
# au démarrage (X_AUTHELIA_CONFIG_FILTERS=template).

theme: dark

server:
  address: 'tcp://:9091/'
  endpoints:
    authz:
      auth-request:
        implementation: 'AuthRequest'

log:
  level: info
  format: json

# Authelia n'a pas de sortie vers Internet : elle ne peut pas comparer son
# heure à un serveur NTP. Elle prend celle de la machine, qui doit donc
# être à l'heure, sinon les codes TOTP sont refusés.
ntp:
  disable_startup_check: true

totp:
  issuer: 'CyberSas'

webauthn:
  display_name: 'CyberSas'

authentication_backend:
  # Pas de réinitialisation par email : un mot de passe perdu passe par un
  # admin, qui relance sas.sh utilisateur.
  password_reset:
    disable: true
  file:
    path: '/utilisateurs/utilisateurs.yml'
    watch: true
    password:
      algorithm: argon2

access_control:
  default_policy: deny
  rules:
    - domain: 'maison.{{ env "DOMAINE" }}'
      subject: ['group:admins', 'group:equipe']
      policy: two_factor

session:
  cookies:
    - domain: '{{ env "DOMAINE" }}'
      authelia_url: 'https://auth.{{ env "DOMAINE" }}'
      default_redirection_url: 'https://maison.{{ env "DOMAINE" }}'

# Trois essais ratés en deux minutes, et le compte est gelé dix minutes.
regulation:
  max_retries: 3
  find_time: 2 minutes
  ban_time: 10 minutes

storage:
  local:
    path: '/data/db.sqlite3'

# Pas de serveur mail dans le labo : les messages d'Authelia, comme
# l'enregistrement d'un second facteur, sont écrits dans ce fichier.
notifier:
  filesystem:
    filename: '/data/notifications.txt'

identity_providers:
  oidc:
    jwks:
      - key_id: 'sas'
        algorithm: 'RS256'
        use: 'sig'
        key: |
          {{- fileContent "/secrets/oidc_jwks.pem" | nindent 10 }}
    authorization_policies:
      vpn:
        default_policy: deny
        rules:
          - policy: two_factor
            subject: ['group:admins', 'group:equipe']
    clients:
      - client_id: 'headscale'
        client_name: 'CyberSas VPN'
        client_secret: '{{ fileContent "/secrets/headscale_oidc_empreinte" | trim }}'
        public: false
        authorization_policy: 'vpn'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://hs.{{ env "DOMAINE" }}/oidc/callback'
        scopes: ['openid', 'email', 'profile', 'groups']
        response_types: ['code']
        grant_types: ['authorization_code']
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'
