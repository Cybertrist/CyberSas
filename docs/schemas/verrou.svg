  <text x="118" y="163" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" font-weight="700" fill="#F1F5F9" text-anchor="start" >intrus</text>
  <text x="118" y="183" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#94A3B0" text-anchor="start" >glissé par le serveur</text>
</g><g>
  <rect x="60" y="248" width="280" height="76" rx="14" fill="#0C1117" stroke="#2A333D"/>
  <rect x="60" y="248" width="280" height="76" rx="14" fill="none" stroke="#3DDC97" stroke-width="1.6" opacity="0" filter="url(#halo)"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.48;0.5;0.93;0.95;1" values="0;0;1;1;0;0"/></rect>
  <rect x="60" y="262" width="3" height="48" rx="1.5" fill="#3DDC97"/>
  <g transform="translate(78,272)"><rect x="5" y="5" width="18" height="13" rx="2" fill="none" stroke="#3DDC97" stroke-width="2"/><path d="M2 23 H26" stroke="#3DDC97" stroke-width="2" stroke-linecap="round"/></g>
  <text x="118" y="283" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" font-weight="700" fill="#F1F5F9" text-anchor="start" >laptop-lea</text>
  <text x="118" y="303" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#94A3B0" text-anchor="start" >signé par le verrou</text>
</g><g>
  <rect x="930" y="188" width="290" height="76" rx="14" fill="#0C1117" stroke="#2A333D"/>
