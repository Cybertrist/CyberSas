<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 414" width="1280" height="414" role="img" aria-label="Les deux couches du protocole. Le téléphone fold8-tristan (A) et la maison (B) ont chacun une session Noise avec le serveur sasd, la couche transport, toujours ouverte en UDP direct. À l'intérieur, A et B ont leur propre session, de bout en bout, ouverte au premier paquet. Un paquet de A vers B voyage dans les deux : le serveur ouvre la trame de relais, lit le destinataire, et la remet à B sans pouvoir ouvrir la session A-B.">
<title>Les deux couches du protocole. Le téléphone fold8-tristan (A) et la maison (B) ont chacun une session Noise avec le serveur sasd, la couche transport, toujours ouverte en UDP direct. À l'intérieur, A et B ont leur propre session, de bout en bout, ouverte au premier paquet. Un paquet de A vers B voyage dans les deux : le serveur ouvre la trame de relais, lit le destinataire, et la remet à B sans pouvoir ouvrir la session A-B.</title>
<defs>
  <filter id="halo" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="doux" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="flou" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  <pattern id="grille" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#31E7FD" stroke-opacity="0.05"/>
  </pattern>
  <radialGradient id="lueur" cx="50%" cy="0%" r="80%">
    <stop offset="0" stop-color="#31E7FD" stop-opacity="0.10"/><stop offset="1" stop-color="#31E7FD" stop-opacity="0"/>
  </radialGradient>
  <marker id="pCYAN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 Z" fill="#31E7FD"/></marker>
  <marker id="pBLEU" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 Z" fill="#01B9FD"/></marker>
  <marker id="pVERT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 Z" fill="#3DDC97"/></marker>
  <marker id="pROUGE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 Z" fill="#FF5C63"/></marker>
  <marker id="pFIL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 Z" fill="#2F3A47"/></marker>
  <marker id="pDISCRET" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 Z" fill="#5C6A7A"/></marker>
</defs>
<rect width="1280" height="414" rx="16" fill="#0D1117"/>
<rect width="1280" height="414" rx="16" fill="url(#grille)"/>
<rect width="1280" height="414" rx="16" fill="url(#lueur)"/>

<text x="640" y="56" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#31E7FD" text-anchor="middle" letter-spacing="3" >DEUX COUCHES, TOUTES DEUX EN NOISE IK</text><text x="640" y="84" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#94A3B0" text-anchor="middle" >Chaque appareil a une session avec le serveur ; chaque paire d’appareils, une session à elle, que le serveur ne peut pas ouvrir.</text>
