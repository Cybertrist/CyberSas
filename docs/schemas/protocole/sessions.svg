<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-label="La vie d'une session sur quatre minutes. La session 1 sert de 0 à 3 minutes ; à 2 minutes, l'initiateur fait une nouvelle poignée de main et la session 2 prend le relais ; à 3 minutes, la session 1 ne chiffre ni ne déchiffre plus rien. En continu, un pair qui n'a rien renvoyé en 10 secondes envoie un paquet vide. Le compteur de chaque paquet sert de nonce. Le répondeur n'adopte la session 2 qu'au premier paquet chiffré avec elle.">
<title>La vie d'une session sur quatre minutes. La session 1 sert de 0 à 3 minutes ; à 2 minutes, l'initiateur fait une nouvelle poignée de main et la session 2 prend le relais ; à 3 minutes, la session 1 ne chiffre ni ne déchiffre plus rien. En continu, un pair qui n'a rien renvoyé en 10 secondes envoie un paquet vide. Le compteur de chaque paquet sert de nonce. Le répondeur n'adopte la session 2 qu'au premier paquet chiffré avec elle.</title>
<defs>
  <filter id="halo" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="doux" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="flou" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  <pattern id="grille" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#31E7FD" stroke-opacity="0.05"/>
  </pattern>
  <radialGradient id="lueur" cx="50%" cy="0%" r="80%">
    <stop offset="0" stop-color="#31E7FD" stop-opacity="0.10"/><stop offset="1" stop-color="#31E7FD" stop-opacity="0"/>
  </radialGradient>
  <marker id="pCYAN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 Z" fill="#31E7FD"/></marker>
  <marker id="pBLEU" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 Z" fill="#01B9FD"/></marker>
  <marker id="pVERT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 Z" fill="#3DDC97"/></marker>
  <marker id="pROUGE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 Z" fill="#FF5C63"/></marker>
  <marker id="pFIL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 Z" fill="#2F3A47"/></marker>
  <marker id="pDISCRET" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 Z" fill="#5C6A7A"/></marker>
</defs>
<rect width="1280" height="480" rx="16" fill="#0D1117"/>
<rect width="1280" height="480" rx="16" fill="url(#grille)"/>
<rect width="1280" height="480" rx="16" fill="url(#lueur)"/>

<text x="640" y="56" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#31E7FD" text-anchor="middle" letter-spacing="3" >LA VIE D’UNE SESSION</text><text x="640" y="84" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#94A3B0" text-anchor="middle" >L’initiateur renouvelle toutes les deux minutes. Passé trois minutes, une session ne chiffre plus rien.</text>
<rect x="140" y="210" width="750" height="34" rx="9" fill="#31E7FD" fill-opacity="0.14" stroke="#31E7FD" stroke-opacity="0.7"/><text x="154" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#31E7FD" text-anchor="start" >session 1</text>
<rect x="640" y="210" width="250" height="34" rx="9" fill="#0D1117" fill-opacity="0.55"/>
<rect x="640" y="260" width="500" height="34" rx="9" fill="#3DDC97" fill-opacity="0.14" stroke="#3DDC97" stroke-opacity="0.7"/><text x="654" y="282" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#3DDC97" text-anchor="start" >session 2</text>
<rect x="140" y="310" width="1000" height="34" rx="9" fill="#01B9FD" fill-opacity="0.14" stroke="#01B9FD" stroke-opacity="0.7"/><text x="154" y="332" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#01B9FD" text-anchor="start" >maintien : un paquet vide si rien n’est reparti en 10 s</text>
<path d="M 140 370 V 378" stroke="#5C6A7A" stroke-width="2"/><text x="140" y="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#5C6A7A" text-anchor="middle" >0 min</text><path d="M 390 370 V 378" stroke="#5C6A7A" stroke-width="2"/><text x="390" y="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#5C6A7A" text-anchor="middle" >1 min</text><path d="M 640 370 V 378" stroke="#5C6A7A" stroke-width="2"/><text x="640" y="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#5C6A7A" text-anchor="middle" >2 min</text><path d="M 890 370 V 378" stroke="#5C6A7A" stroke-width="2"/><text x="890" y="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#5C6A7A" text-anchor="middle" >3 min</text><path d="M 1140 370 V 378" stroke="#5C6A7A" stroke-width="2"/><text x="1140" y="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#5C6A7A" text-anchor="middle" >4 min</text>
<path d="M 140 374 H 1140" stroke="#2F3A47" stroke-width="2"/>
<g><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" values="0 0;1000 0" keyTimes="0;1"/>
  <path d="M 140 190 V 374" stroke="#31E7FD" stroke-width="2"/><circle cx="140" cy="190" r="5" fill="#31E7FD" filter="url(#halo)"/></g>
<g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.47;0.49;0.74;0.76;1" values="0;0;1;1;0;0"/><rect x="509.88" y="146" width="260.24" height="32" rx="9" fill="#0B1A14" stroke="#3DDC97" stroke-opacity="0.6"/><text x="640" y="166.32" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#3DDC97" text-anchor="middle" >2 min : nouvelle poignée de main</text></g>
<g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.72;0.74;0.99;1" values="0;0;1;1;1"/><rect x="756.22" y="146" width="267.56" height="32" rx="9" fill="#1A0D10" stroke="#FF5C63" stroke-opacity="0.6"/><text x="890" y="166.32" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#FF5C63" text-anchor="middle" >3 min : la session 1 ne sert plus</text></g>
<g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.02;0.49;0.51;1" values="0;1;1;0;0"/><rect x="223.28" y="146" width="333.44" height="32" rx="9" fill="#0A1B22" stroke="#31E7FD" stroke-opacity="0.6"/><text x="390" y="166.32" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#31E7FD" text-anchor="middle" >le compteur de chaque paquet sert de nonce</text></g>
<text x="640" y="446" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#94A3B0" text-anchor="middle" >Le répondeur n’adopte la session 2 qu’au premier paquet chiffré avec elle : la preuve que l’autre a les mêmes clés.</text>
</svg>