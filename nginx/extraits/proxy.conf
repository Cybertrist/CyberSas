# En-têtes transmis au service derrière Nginx. Ceux qu'un client aurait
# envoyés lui-même sont écrasés : le service ne croit que Nginx.
proxy_http_version 1.1;
proxy_set_header Host $server_name;
# Seul le WebSocket peut changer de protocole. Un « Upgrade: h2c » ouvrirait
# un canal où les requêtes suivantes échapperaient à la vérification.
proxy_set_header Upgrade $upgrade_accepte;
proxy_set_header Connection $connection_upgrade;
proxy_set_header X-Original-URL $scheme://$server_name$request_uri;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $server_name;
proxy_set_header X-Forwarded-URI $request_uri;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;

# Tampons par défaut : 64 tampons de 256 Ko, c'était jusqu'à 16 Mo par
# connexion vers un client lent, de quoi épuiser la mémoire du serveur.
client_body_buffer_size 16k;
proxy_read_timeout 360;
proxy_send_timeout 360;
proxy_connect_timeout 30;
