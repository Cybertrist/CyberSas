<g opacity="0"><animate attributeName="opacity" dur="11s" repeatCount="indefinite" keyTimes="0;0.11;0.13;0.25;0.27;1" values="0;0;1;1;0;0"/><rect x="684.06" y="159" width="91.88" height="32" rx="9" fill="#1A0D10" stroke="#FF5C63" stroke-opacity="0.6"/><text x="730" y="179.32" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#FF5C63" text-anchor="middle" >… silence</text></g>
<g opacity="0"><animate attributeName="opacity" dur="11s" repeatCount="indefinite" keyTimes="0;0.33;0.35;0.47;0.49;1" values="0;0;1;1;0;0"/><rect x="647.46" y="264" width="165.08" height="32" rx="9" fill="#1A0D10" stroke="#FF5C63" stroke-opacity="0.6"/><text x="730" y="284.32" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#FF5C63" text-anchor="middle" >nom inconnu : coupé</text></g>
