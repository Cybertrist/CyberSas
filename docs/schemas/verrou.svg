  <g transform="translate(948,212)"><path d="M14 2 L24 6 V13 C24 19 19.5 23.5 14 26 C8.5 23.5 4 19 4 13 V6 Z" fill="none" stroke="#31E7FD" stroke-width="2" stroke-linejoin="round"/><path d="M9.5 14 L12.5 17 L18.5 11" fill="none" stroke="#31E7FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="988" y="223" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" font-weight="700" fill="#F1F5F9" text-anchor="start" >fold8-tristan</text>
  <text x="988" y="243" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#94A3B0" text-anchor="start" >vérifie la signature</text>
</g>
<g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.045;0.06;0.3;0.315;1" values="0;0;1;1;0;0"/><g filter="url(#halo)"><circle r="10" fill="#FF5C63" opacity="0.22"/><circle r="5" fill="#FF5C63"/><animateMotion dur="9s" repeatCount="indefinite" path="M 340 166 C 635 166 635 210.8 930 210.8" calcMode="linear" keyTimes="0;0.06;0.3;1" keyPoints="0;0;0.97;0.97"/></g></g>
<g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.28;0.3;0.46;0.48;1" values="0;0;1;1;0;0"/><g transform="translate(892.8,199.6) scale(0.8)"><circle cx="14" cy="14" r="11" fill="none" stroke="#FF5C63" stroke-width="2"/><path d="M10 10 L18 18 M18 10 L10 18" stroke="#FF5C63" stroke-width="2" stroke-linecap="round"/></g><rect x="923.225" y="282" width="303.55" height="32" rx="9" fill="#1A0D10" stroke="#FF5C63" stroke-opacity="0.6"/><text x="1075" y="302.68" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#FF5C63" text-anchor="middle" >refusé · pas de signature du verrou</text></g>
<g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.485;0.5;0.74;0.755;1" values="0;0;1;1;0;0"/><g filter="url(#halo)"><circle r="10" fill="#3DDC97" opacity="0.22"/><circle r="5" fill="#3DDC97"/><animateMotion dur="9s" repeatCount="indefinite" path="M 340 286 C 635 286 635 241.2 930 241.2" calcMode="linear" keyTimes="0;0.5;0.74;1" keyPoints="0;0;1;1"/></g></g>
