<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="1280" height="620" role="img" aria-label="La poignée de main Noise IK, en un aller-retour. Message 1, de l'initiateur au répondeur : e, es, s, ss et un horodatage TAI64N chiffré, 148 octets avec mac1 et mac2. Le répondeur ne répond pas à une clé inconnue. Message 2, en retour : e, ee, se et une charge vide chiffrée, 92 octets. Chaque côté en tire deux clés de session, une par sens, renouvelées toutes les deux minutes. e est la clé éphémère, s la clé statique envoyée chiffrée ; es, ss, ee et se sont des échanges X25519 mêlés au hachage.">
<title>La poignée de main Noise IK, en un aller-retour. Message 1, de l'initiateur au répondeur : e, es, s, ss et un horodatage TAI64N chiffré, 148 octets avec mac1 et mac2. Le répondeur ne répond pas à une clé inconnue. Message 2, en retour : e, ee, se et une charge vide chiffrée, 92 octets. Chaque côté en tire deux clés de session, une par sens, renouvelées toutes les deux minutes. e est la clé éphémère, s la clé statique envoyée chiffrée ; es, ss, ee et se sont des échanges X25519 mêlés au hachage.</title>
