  <rect x="40" y="120" width="260" height="76" rx="14" fill="none" stroke="#31E7FD" stroke-width="1.6" opacity="0" filter="url(#halo)"><animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.02;0.3;0.32;1" values="0;1;1;0;0"/></rect>
  <rect x="40" y="134" width="3" height="48" rx="1.5" fill="#31E7FD"/>
