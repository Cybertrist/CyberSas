  <text x="1082" y="207" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="700" fill="#F1F5F9" text-anchor="start" >effacée</text>
  <text x="1082" y="227" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#94A3B0" text-anchor="start" >tableaux remis à zéro</text>
</g>
<path d="M 150 294 H 1130" stroke="#2F3A47" stroke-width="2" stroke-dasharray="4 6"/>
<g opacity="0"><animate attributeName="opacity" dur="11s" repeatCount="indefinite" keyTimes="0;0.055;0.07;0.71;0.725;1" values="0;0;1;1;0;0"/><g filter="url(#halo)"><circle r="10" fill="#3DDC97" opacity="0.22"/><circle r="5" fill="#3DDC97"/><animateMotion dur="11s" repeatCount="indefinite" path="M 150 294 H 1130" calcMode="linear" keyTimes="0;0.07;0.23;0.39;0.55;0.71;1" keyPoints="0;0;0.25;0.5;0.75;1;1"/></g></g>
<text x="640" y="340" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#94A3B0" text-anchor="middle" >Une empreinte ajoutée au téléphone invalide la clé AES : il faut ranger le verrou à nouveau.</text>
<text x="640" y="364" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#94A3B0" text-anchor="middle" >Le fichier chiffré, copié ailleurs, ne vaut rien : la clé AES ne quitte jamais la puce.</text>
</svg>