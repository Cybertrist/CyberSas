  <rect x="60" y="128" width="280" height="76" rx="14" fill="none" stroke="#FF5C63" stroke-width="1.6" opacity="0" filter="url(#halo)"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.03;0.05;0.46;0.48;1" values="0;0;1;1;0;0"/></rect>
