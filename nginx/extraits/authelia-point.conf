# Le point interne par lequel Nginx interroge Authelia. Invisible de
# l'extérieur (internal) et sans le corps de la requête.
location /internal/authelia/authz {
    internal;
    set $authelia_authz http://authelia:9091/api/authz/auth-request;
    proxy_pass $authelia_authz;

    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URL $scheme://$host$request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Content-Length "";
    proxy_set_header Connection "";
    proxy_pass_request_body off;

    proxy_http_version 1.1;
    proxy_cache_bypass $cookie_session;
    proxy_no_cache $cookie_session;
    proxy_buffers 4 32k;
    client_body_buffer_size 128k;
}
