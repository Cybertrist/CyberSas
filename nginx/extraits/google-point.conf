# Le point interne par lequel Nginx demande à oauth2-proxy si la personne
# est connectée. 202 : oui. 401 : non. Invisible de l'extérieur (internal),
# et sans le corps de la requête.
location = /oauth2/auth {
    internal;
    set $oauth2 http://oauth2-proxy:4180;
    proxy_pass $oauth2;

    # Tous les en-têtes que croit oauth2-proxy sont posés ici : ceux que le
    # client aurait envoyés sont écrasés.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Uri $request_uri;
    proxy_set_header Content-Length "";
    proxy_pass_request_body off;
}
