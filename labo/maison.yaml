# Le labo : ce qui, en vrai, ne tournerait pas sur le VPS.
#
# maison joue le serveur à la maison. Il n'a aucun port publié : il sort
# vers le VPS par notre tunnel, et c'est tout. Le service de démonstration,
# whoami, vit dans son espace réseau et répond sur maison.sas.internal:80.
# demo-admin fait de même sur le port 8080.
#
# poste joue l'ordinateur d'un membre de l'équipe, pour vérifier que les
# règles d'accès laissent passer ce qu'elles doivent, et rien d'autre.
#
# Les deux font tourner notre client, sas, et rejoignent le réseau
# « public » de la pile principale, qui tient lieu d'Internet.

name: cybersas-labo

x-noeud: &noeud
  image: cybersas:dev
  restart: unless-stopped
  command: ["sas", "demon"]
  cap_add: [NET_ADMIN]
  devices: ["/dev/net/tun:/dev/net/tun"]
  environment:
    SAS_CA: /ca/cybersas-ca.pem
  networks: [public]

services:
  maison:
    <<: *noeud
    hostname: maison
    volumes:
      - maison:/var/lib/sas
      - ../etat/ca/public:/ca:ro

  demo:
    image: traefik/whoami:v1.12.0
    restart: unless-stopped
    network_mode: service:maison
    depends_on: [maison]

  # Un second service, sur 8080, que la politique ne donne pas à l'équipe :
  # l'essai vérifie qu'elle s'y cogne.
  demo-admin:
    image: traefik/whoami:v1.12.0
    restart: unless-stopped
    command: ["--port", "8080"]
    network_mode: service:maison
    depends_on: [maison]

  poste:
    <<: *noeud
    hostname: poste
    volumes:
      - poste:/var/lib/sas
      - ../etat/ca/public:/ca:ro

networks:
  public:
    name: cybersas_public
    external: true

volumes:
  maison:
  poste:
